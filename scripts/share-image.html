<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#f6f5f3;font-family:Geist,sans-serif;padding:14px}
.card{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:#0a0a0a;color:#fff;padding:56px 64px;
 background-image:linear-gradient(to right,rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.06) 1px,transparent 1px);background-size:40px 40px}
.glow{position:absolute;right:-160px;bottom:-260px;width:720px;height:720px;border-radius:50%;background:rgba(248,73,1,.35);filter:blur(120px)}
.top{position:relative;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;font-weight:600;font-size:22px}
.brand img{height:30px}
.dot{display:flex;align-items:center;gap:10px;font-size:20px;color:rgba(255,255,255,.7)}
.dot i{width:10px;height:10px;border-radius:50%;background:#f84901;display:block}
h1{position:relative;margin-top:44px;font-size:92px;line-height:.92;font-weight:600;letter-spacing:-.035em;text-transform:uppercase;max-width:900px}
h1 span{color:#f84901}
.row{position:absolute;left:64px;right:64px;bottom:52px;display:flex;align-items:center;gap:14px}
.pill{border-radius:999px;padding:16px 26px;font-weight:600;font-size:24px}
.p1{background:#f84901}
.p2{border:1.5px solid rgba(255,255,255,.3)}
.tag{position:absolute;right:64px;top:126px;transform:rotate(6deg);background:#fff;color:#0a0a0a;border-radius:999px;padding:12px 22px;font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.url{margin-left:auto;font-family:'Geist Mono',monospace;font-size:20px;color:rgba(255,255,255,.55)}
</style></head><body>
<div class="card"><div class="glow"></div>
 <div class="top"><div class="brand"><img src="https://citrusarc.studio/Images/brand-logo.png" alt="">Meta Ads Skill · Citrus Arc</div><div class="dot"><i></i>Claude Skill untuk SME Malaysia</div></div>
 <div class="tag">BM &amp; English</div>
 <h1>Ajar Claude jadi <span>pakar Meta Ads</span> bisnes anda.</h1>
 <div class="row"><div class="pill p1">Basic · Percuma</div><div class="pill p2">Advanced · Audit penuh</div><div class="url">citrusarc.studio</div></div>
</div></body></html>
